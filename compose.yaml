services:

  api:
    image: api:latest
    build:
      context: search-services
      dockerfile: Dockerfile.api
    container_name: api
    restart: unless-stopped
    ports:
      - 28080:8080
    volumes:
      - ./search-services/api/config.yaml:/config.yaml
    env_file:
      - .env.${ENV_FILE:-local}
    depends_on:
      - words
      - update
      - search

  words:
    image: words:latest
    build:
      context: search-services
      dockerfile: Dockerfile.words
    container_name: words
    restart: unless-stopped
    ports:
      - 28081:8080
    volumes:
      - ./search-services/words/config.yaml:/config.yaml
    env_file:
      - .env.${ENV_FILE:-local}
  update:
    image: update:latest
    build:
      context: search-services
      dockerfile: Dockerfile.update
    container_name: update
    restart: unless-stopped
    ports:
      - 28082:8080
    volumes:
      - ./search-services/update/config.yaml:/config.yaml
    env_file:
      - .env.${ENV_FILE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      words:
        condition: service_started
      nats:
        condition: service_started

  tests:
    image: tests:latest
    build: tests
    container_name: tests
    restart: "no"
    entrypoint: "true"

  postgres:
    image: postgres
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env.${ENV_FILE:-local}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  search:
    image: search:latest
    build:
      context: search-services
      dockerfile: Dockerfile.search
    container_name: search
    restart: unless-stopped
    ports:
      - 28083:8080
    volumes:
      - ./search-services/search/config.yaml:/config.yaml
    env_file:
      - .env.${ENV_FILE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      words:
        condition: service_started
      nats:
        condition: service_started

  web:
    image: web:latest
    build:
      context: search-services
      dockerfile: Dockerfile.web  
    container_name: web
    env_file:
      - .env.${ENV_FILE:-local}
    restart: unless-stopped
    ports:
      - "80:80"

  categorizer:
    image: categorizer:latest
    build:
      context: search-services
      dockerfile: Dockerfile.categorizer
    container_name: categorizer
    restart: unless-stopped
    ports:
      - 28084:8080
    volumes:
      - ./search-services/categorizer/config.yaml:/config.yaml
    env_file:
      - .env.${ENV_FILE:-local}
    depends_on:
      nats:
        condition: service_started
      ollama:
        condition: service_healthy

  ollama:
    image: my-ollama:latest
    build: 
      context: search-services
      dockerfile: Dockerfile.ollama
    container_name: ollama
    ports:
      - 11435:11434
    env_file:
      - .env.${ENV_FILE:-local}    
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    ports:
      - "18888:80"
    env_file:
      - .env.${ENV_FILE:-local}
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  nats:
    image: nats
    ports:
      - "4222:4222"
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000" 
      - "9001:9001"
    env_file:
      - .env.${ENV_FILE:-local}
    volumes:
      - minio-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


  initminio:
    image: minio/mc:latest
    container_name: minio_mc
    depends_on:
      - minio
    env_file:
      - .env.${ENV_FILE:-local}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/images;
      /usr/bin/mc anonymous set download myminio/images;
      echo 'all done';
      exit 0;
      "

volumes:
  postgres:
  pgadmin:
  minio-storage:
  ollama_data:
